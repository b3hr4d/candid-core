# Publishing @candid-core/cli — dispatch-only, mirroring npm-release.yml's
# discipline exactly, because this second npm name is just as permanent:
#
# - inputs are shape-checked before anything touches the network, and every
#   input reaches a script through `env:`, never through `${{ }}`
#   interpolation inside `run:`;
# - `commit` must be a full SHA reachable from `origin/main`;
# - the irreversible step sits behind the same protected `npm-publish`
#   environment, whose required reviewers the verify job checks exist;
# - no long-lived token exists anywhere: publishing uses npm OIDC trusted
#   publishing, and `id-token: write` is granted to that one job;
# - unlike the schema package, the artifact embeds a wasm build, so the
#   verify and publish jobs both build it with the exact-pinned release
#   toolchain and the pinned wasm-pack — the rolling `stable` of ordinary CI
#   never touches a published byte.
#
# docs/releasing.md is the procedure of record. This workflow is prepared
# per the issue #153 decision and has deliberately not been dispatched: the
# @candid-core/cli name is recorded with owner sign-off, and the first
# publish is the owner's explicit act.
name: npm release (cli)

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character SHA to publish from, reachable from main
        required: true
      version:
        description: Must equal the version in crates/candid-core-wasm/npm/package.json at that commit
        required: true

permissions: {}

concurrency:
  group: npm-release-cli-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the artifact before anything irreversible
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate the input shapes
        env:
          COMMIT: ${{ inputs.commit }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          printf '%s' "${COMMIT}" | grep -qE '^[0-9a-f]{40}$' \
            || { echo "commit must be a full 40-character lowercase SHA" >&2; exit 1; }
          printf '%s' "${VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            || { echo "version must be semver, e.g. 0.1.0" >&2; exit 1; }

      - name: Confirm the publish environment is protected
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          reviewers="$(gh api "repos/${REPO}/environments/npm-publish" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length' \
            2>/dev/null || echo unreadable)"
          if [ "${reviewers}" = unreadable ]; then
            echo "cannot read the npm-publish environment; create it with required reviewers (docs/releasing.md)" >&2
            exit 1
          fi
          if [ "${reviewers}" -lt 1 ]; then
            echo "the npm-publish environment has no required reviewers; it is not a gate" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm the commit is an ancestor of main
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          git merge-base --is-ancestor "${COMMIT}" FETCH_HEAD \
            || { echo "${COMMIT} is not reachable from origin/main" >&2; exit 1; }

      - name: The requested version must match the manifest exactly
        working-directory: crates/candid-core-wasm/npm
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          manifest="$(node -p 'require("./package.json").version')"
          if [ "${manifest}" != "${VERSION}" ]; then
            echo "manifest is ${manifest}, requested ${VERSION}" >&2
            exit 1
          fi

      - name: Read the pinned toolchain
        run: grep -E '^[A-Z_]+=' tests/fixtures/packaging/release-tools.env >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RELEASE_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - name: Install the pinned wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          registry-url: https://registry.npmjs.org

      - name: Build the wasm artifact
        working-directory: crates/candid-core-wasm
        run: wasm-pack build --target web --out-dir npm/wasm --no-pack --release -- --locked

      - name: Host parity battery
        working-directory: crates/candid-core-wasm
        run: cargo test --locked

      - name: Parity through the wasm under Node
        working-directory: crates/candid-core-wasm/npm
        run: |
          set -euo pipefail
          npm ci
          npm test

  publish:
    name: Publish to npm (protected)
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Read the pinned toolchain
        run: grep -E '^[A-Z_]+=' tests/fixtures/packaging/release-tools.env >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RELEASE_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - name: Install the pinned wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          registry-url: https://registry.npmjs.org

      - name: Build the wasm artifact
        working-directory: crates/candid-core-wasm
        run: wasm-pack build --target web --out-dir npm/wasm --no-pack --release -- --locked

      - name: Publish with provenance
        working-directory: crates/candid-core-wasm/npm
        run: npm publish --provenance --access public
