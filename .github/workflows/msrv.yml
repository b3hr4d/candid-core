name: Verify

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: read

jobs:
  msrv:
    name: Rust 1.78
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.78.0
      - name: Test the locked dependency graph
        run: cargo test --all-targets --locked
  stable:
    name: Stable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --all-targets --locked
  features:
    name: Feature matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Every supported combination, so a change that only compiles with
      # defaults fails here rather than in a downstream `default-features =
      # false` consumer. Suites that need a feature throughout declare
      # `required-features` and are skipped; suites with pure-model coverage
      # gate individual cases and still run with no features at all.
      - name: Test every feature combination
        run: |
          set -euxo pipefail
          cargo test --all-targets --locked --no-default-features
          cargo test --all-targets --locked --no-default-features --features host-value
          cargo test --all-targets --locked --no-default-features --features compiler
          cargo test --all-targets --locked --no-default-features --features compiler,host-value
          cargo test --all-targets --locked --no-default-features --features filesystem-compiler
          cargo test --all-targets --locked --all-features
      - name: Lint every feature combination
        run: |
          set -euxo pipefail
          cargo clippy --all-targets --locked --no-default-features -- -D warnings
          cargo clippy --all-targets --locked --no-default-features --features host-value -- -D warnings
          cargo clippy --all-targets --locked --no-default-features --features compiler -- -D warnings
          cargo clippy --all-targets --locked --no-default-features --features filesystem-compiler -- -D warnings
      # Doctests and rustdoc are feature-sensitive too: an intra-doc link to an
      # item that only exists behind a feature must not break the reduced build.
      - name: Documentation for the reduced and full surfaces
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          set -euxo pipefail
          cargo test --doc --locked --no-default-features
          cargo test --doc --locked --all-features
          cargo doc --no-deps --locked --no-default-features
          cargo doc --no-deps --locked --all-features
  dependency-boundaries:
    name: Feature dependency boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # Resolves `cargo metadata` per feature set and target and asserts what
      # each one may and may not contain. This is the evidence behind the
      # feature split: without it, "the base has no Candid engine" is a claim
      # about source files rather than about what a consumer builds.
      - name: Verify what each feature set puts in a consumer's graph
        run: python3 tests/fixtures/packaging/verify_feature_graph.py
  conformance-reference:
    name: Independent conformance reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A standard-library Python canonicalizer recomputes every manifest
      # vector's canonical graph, payload bytes, preimage, and IDs from the
      # raw noncanonical inputs, entirely outside the Rust implementation.
      # Kept as its own job: the Rust suites do not run Python transitively,
      # and a Python subprocess inside cross-platform Rust tests would be
      # brittle.
      - name: Reproduce every conformance vector without Rust
        run: python3 tests/fixtures/conformance/verify_vectors.py
  artifact-identity-reference:
    name: Independent artifact identity reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Detached artifact identity (issue #25) is a separate claim from
      # canonicalization, over a separate manifest, so it gets its own job
      # rather than being folded into the conformance reference above: the
      # closed semantic conformance set must keep meaning exactly what it did.
      # A standard-library Python implementation recomputes every artifact ID
      # from the exact bytes on disk and re-checks that one shared semantic
      # `contract_id` spans several distinct artifact IDs.
      - name: Reproduce every artifact identity vector without Rust
        run: python3 tests/fixtures/artifact-identity/verify_artifact_ids.py
  wasm:
    name: Stable WASM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      # A build check, not a runtime claim — the runtime claim is the `browser`
      # job below. The default build still succeeds here because `cap-std` is
      # declared under `cfg(not(target_os = "unknown"))` as well as behind
      # `filesystem-compiler`.
      - name: Check WASM library across feature sets
        run: |
          set -euxo pipefail
          cargo check --lib --target wasm32-unknown-unknown --locked --no-default-features
          cargo check --lib --target wasm32-unknown-unknown --locked --no-default-features --features host-value
          cargo check --lib --target wasm32-unknown-unknown --locked --no-default-features --features compiler
          cargo check --lib --target wasm32-unknown-unknown --locked
      # `compiler` on `wasm32-unknown-unknown` is the configuration a browser
      # host actually ships since issue #21, so it is the one held to
      # warnings-denied — including the browser suite itself, which no other
      # job lints for that target.
      - name: Lint the browser configuration with warnings denied
        run: |
          set -euxo pipefail
          cargo clippy --lib --target wasm32-unknown-unknown --locked --no-default-features --features compiler -- -D warnings
          cargo clippy --test browser_wasm --target wasm32-unknown-unknown --locked --no-default-features --features compiler -- -D warnings
  browser:
    name: Browser runtime (headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      # Pin the browser exactly, not a rolling channel: `150.0.7871.124` is a
      # specific Chrome for Testing build, and `install-chromedriver` takes the
      # ChromeDriver from that same build, so the pair is matched by
      # construction. A browser upgrade then becomes a deliberate edit to this
      # file rather than a silent change to what the runtime evidence was
      # collected on. The action puts that browser on `PATH`, which is where
      # ChromeDriver resolves it from.
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: '150.0.7871.124'
          install-chromedriver: true
          install-dependencies: true
      - name: Install the pinned wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked
      # The real runtime claim: `tests/browser_wasm.rs` compiles a
      # self-contained source *and* an imported multi-file bundle — both import
      # kinds plus a diamond — inside headless Chrome, pins the resulting
      # Contract identities and provenance, and proves that resolver, resource,
      # cancellation, and deadline failures stay structured on a target with no
      # filesystem and no clock. `--no-default-features --features compiler` is
      # exactly what a browser host builds.
      #
      # `--chromedriver` is what makes the pin hold: without it `wasm-pack`
      # downloads its own latest ChromeDriver, which can be a different major
      # version from the browser installed above and fails the WebDriver
      # session before a single test runs. `--chrome` is passed explicitly
      # alongside it: `wasm-pack test --help` says `--chromedriver` implies
      # `--chrome`, but 0.14.0 does not apply that implication and exits with
      # "Must specify at least one of `--node`, `--chrome`, `--firefox`, or
      # `--safari`" when only the driver path is given. A non-zero exit from
      # wasm-pack — a build failure, a browser that will not start, or a failed
      # assertion inside Chrome — fails this job.
      - name: Compile imported bundles in headless Chrome
        run: |
          set -euxo pipefail
          '${{ steps.chrome.outputs.chrome-path }}' --version
          '${{ steps.chrome.outputs.chromedriver-path }}' --version
          wasm-pack test --headless --chrome --chromedriver '${{ steps.chrome.outputs.chromedriver-path }}' -- --locked --test browser_wasm --no-default-features --features compiler
  generator:
    name: Generator crate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # The boundary claim from issue #38, enforced rather than narrated: the
      # library builds on the base surface with no feature at all. The golden
      # tests need `compiler` (they compile fixtures and use the provenance
      # name bridge), so both configurations run.
      - name: Check the featureless library
        run: cargo check -p candid-core-ts --locked
      - name: Lint both feature configurations
        run: |
          set -euxo pipefail
          cargo clippy -p candid-core-ts --all-targets --locked -- -D warnings
          cargo clippy -p candid-core-ts --all-targets --features compiler --locked -- -D warnings
      - name: Test both feature configurations
        run: |
          set -euxo pipefail
          cargo test -p candid-core-ts --locked
          cargo test -p candid-core-ts --features compiler --locked
      # Golden TypeScript that does not type-check is not evidence of anything,
      # so the checked-in goldens are compiled by the exact TypeScript pinned in
      # ts/package-lock.json under strict mode. SHA-pinned like the release
      # workflows' actions: this step is where Node enters CI, and a new
      # supply-chain surface gets the strictest pin available. The Principal
      # import resolves to a local type stub via tsconfig paths, so the check
      # needs no npm package beyond the compiler itself.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.18.0'
      - name: Type-check the golden TypeScript
        working-directory: crates/candid-core-ts/ts
        run: |
          set -euxo pipefail
          npm ci
          npx tsc --noEmit
      # Formatting is enforced here rather than trusted to editors and agent
      # hooks, which are per-machine and per-tool and cannot be verified from a
      # pull request. Prettier is exact-pinned in ts/package-lock.json for the
      # same reason `cargo fmt --check` runs on a single job above: two
      # contributors on different formatter versions produce a diff neither of
      # them wrote.
      #
      # The script runs from the repository root, against the root
      # .prettierrc.json and .prettierignore, so this check, `npm run format`,
      # the pre-commit hook, and the agent hook are the same invocation. The
      # generated goldens under tests/goldens/ are ignored: their layout
      # belongs to the emitter, and formatting them would turn the golden suite
      # red (verified — Prettier rewrites 6 of the 10).
      - name: Check TypeScript formatting
        working-directory: crates/candid-core-ts/ts
        run: npm run format:check
      # The schema runtime (issue #102) runs on Node's built-in test runner
      # with native type stripping: no test framework enters the supply chain,
      # and the exact-pinned Node above is the entire runtime. The suite
      # includes the golden cross-check — the dynamically loaded Contract JSON
      # schemas must validate exactly the values the generated builders
      # describe — so a failure here is a mapping regression, not flake.
      - name: Run the schema runtime tests
        working-directory: crates/candid-core-ts/ts
        run: npm test
      # The packaged-consumer gate (issue #106): the artifact npm would ship
      # must stand alone — root and subpath exports resolving, compiling
      # under the pinned tsc, and executing a real round-trip.
      - name: Verify the npm package artifact
        run: python3 tests/fixtures/packaging/verify_npm_package.py

  benchmark-smoke:
    name: Benchmark smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile and exercise every benchmark once
        run: cargo bench --benches --locked -- --test
  benchmarks:
    name: Scheduled benchmarks
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Record environment
        run: |
          mkdir -p benchmark-artifacts
          rustc --version --verbose > benchmark-artifacts/environment.txt
          cargo --version >> benchmark-artifacts/environment.txt
          uname -a >> benchmark-artifacts/environment.txt
          echo "git_sha=${GITHUB_SHA}" >> benchmark-artifacts/environment.txt
      # Before the suite, not after: the manifest file's mtime is the run epoch
      # that `compare.py` uses to reject Criterion results left over from an
      # earlier run in the same `target/criterion`.
      - name: Emit the benchmark manifest
        run: cargo bench --bench manifest --locked > benchmark-artifacts/manifest.json
      - name: Run statistical benchmarks
        run: cargo bench --bench compilation --locked -- --noplot
      - name: Run allocation probe
        run: cargo bench --bench allocation --locked > benchmark-artifacts/allocations.json
      - name: Collect machine-readable Criterion results
        run: cp -R target/criterion benchmark-artifacts/criterion
      # A candidate baseline, captured on the runner class that pull-request
      # comparisons run on — a baseline captured on a maintainer's machine can
      # never be environment-compatible with CI. Uploading it does not adopt it:
      # committing `benchmark-artifacts/baseline.json` to
      # `benches/baselines/main.json` is a reviewed change, made deliberately,
      # with the reason recorded in the commit (docs/benchmarks.md).
      - name: Capture a candidate baseline
        run: |
          python3 tests/fixtures/benchmarks/compare.py capture \
            --manifest benchmark-artifacts/manifest.json \
            --criterion target/criterion \
            --allocations benchmark-artifacts/allocations.json \
            --out benchmark-artifacts/baseline.json \
            --note "captured by Verify run ${GITHUB_RUN_ID} on ${GITHUB_SHA}"
      - uses: actions/upload-artifact@v4
        with:
          name: benchmarks-${{ github.sha }}
          path: benchmark-artifacts
          retention-days: 90
  fuzz-replay:
    name: Fuzz targets build and replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      # `cargo fuzz` has no --locked passthrough, so enforce the tracked
      # lockfile separately. Fails if fuzz/Cargo.lock is stale or incomplete.
      - name: Verify the fuzz lockfile is current
        run: cargo metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 > /dev/null
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked
      # Compiling every target on each pull request is the point of this job:
      # a target that stops compiling, or is renamed without updating
      # `fuzz/Cargo.toml`, otherwise stays invisible until the next schedule.
      - name: Build every fuzz target
        run: cargo +nightly fuzz build --dev
      # `-runs=0` replays the tracked corpora without mutating, so this is
      # deterministic: it fails only if a seed or a previously fixed crash
      # reproduces. No new inputs are generated, so it cannot flake.
      - name: Replay seeds and regressions
        run: |
          for target in $(cargo +nightly fuzz list); do
            mkdir -p "fuzz/corpus/${target}" "fuzz/seeds/${target}" "fuzz/regressions/${target}"
            echo "::group::replay ${target}"
            cargo +nightly fuzz run --dev "${target}" \
              "fuzz/corpus/${target}" "fuzz/seeds/${target}" "fuzz/regressions/${target}" \
              -- -runs=0
            echo "::endgroup::"
          done
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-replay-artifacts-${{ github.sha }}
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 30
  fuzz:
    name: Scheduled fuzzing
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      # `cargo fuzz` has no --locked passthrough, so enforce the tracked
      # lockfile separately. Fails if fuzz/Cargo.lock is stale or incomplete.
      - name: Verify the fuzz lockfile is current
        run: cargo metadata --manifest-path fuzz/Cargo.toml --locked --format-version 1 > /dev/null
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked
      # Seeds and regressions are passed as additional read-only corpora.
      # libFuzzer writes only to the first directory, which is gitignored, so a
      # run never mutates tracked inputs. Seeding matters: starting cold, these
      # targets spend their budget in the JSON syntax-error path.
      - name: Fuzz trust boundaries
        run: |
          for target in $(cargo +nightly fuzz list); do
            mkdir -p "fuzz/corpus/${target}" "fuzz/seeds/${target}" "fuzz/regressions/${target}"
            echo "::group::fuzz ${target}"
            cargo +nightly fuzz run "${target}" \
              "fuzz/corpus/${target}" "fuzz/seeds/${target}" "fuzz/regressions/${target}" \
              -- -max_total_time=60
            echo "::endgroup::"
          done
      # Without this the reproducer dies with the runner and a red schedule is
      # not actionable. Runs on failure and on success, because libFuzzer also
      # writes slow-unit and oom artifacts on otherwise-passing runs.
      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ github.sha }}
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 90
