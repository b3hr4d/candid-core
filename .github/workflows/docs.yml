# The documentation site (website/).
#
# Pages is enabled for this repository with "GitHub Actions" as the source, so
# the site publishes to https://b3hr4d.github.io/candid-core/ — a project
# subpath, not a domain root. Every asset and internal link the generator emits
# is relative for that reason; verified by serving website/dist under a
# /candid-core/ prefix before this workflow was wired up.
#
# Three triggers, one of which publishes:
# - `pull_request` builds and checks only. A broken sitemap, a dead internal
#   link, an anchor that no longer resolves, an install line for a package
#   that is not published, or a caret dependency line that cannot resolve
#   fails review rather than reaching the published site. It publishes nothing.
# - `push` to main republishes after a merge, filtered to the paths that can
#   change the site.
# - `workflow_dispatch` republishes on demand, for a redeploy that no commit
#   caused. A dispatch can select any ref, and `actions/checkout` would take
#   that ref, so the deploy job also requires `github.ref` to be main: there is
#   one Pages site and no preview channel, so deploying a branch would replace
#   the public documentation with unmerged content. A dispatch from another ref
#   builds and checks, and says why it did not publish.
#
# Every action is pinned by commit SHA, like the release workflows. The
# toolchain is not a canary here: the site build is release tooling.
name: Docs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"

      # No `npm ci`: the site has no dependencies, by design. If this step
      # ever needs one, that is a decision to take in review.
      - name: Assert the site has no dependencies
        run: |
          if [ -e website/package.json ] || [ -e website/node_modules ]; then
            echo "website/ must stay dependency-free" >&2
            exit 1
          fi

      - name: Build
        run: node website/build.mjs

      - name: Check
        run: node website/check.mjs

      # A skipped deploy job is easy to misread as a successful one, so a
      # dispatch that cannot publish says so on the run itself.
      - name: Explain why this run will not publish
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::warning title=No deployment::Dispatched from ${{ github.ref }}. \
          Pages publishes only from refs/heads/main, so this run builds and checks \
          but does not deploy. Re-run it with main selected to republish."

      - name: Upload the built site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-site
          path: website/dist
          if-no-files-found: error

  deploy:
    name: Deploy to Pages
    # Two conditions, not one. `github.event_name` alone would let a dispatch
    # from a feature branch publish that branch to the live site.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"

      - name: Build
        run: node website/build.mjs && node website/check.mjs

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist
      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
