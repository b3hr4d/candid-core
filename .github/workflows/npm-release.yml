# Publishing @candid-core/schema — dispatch-only, mirroring release.yml's
# discipline for crates.io, because npm names and versions are just as
# permanent:
#
# - inputs are shape-checked before anything touches the network, and every
#   input reaches a script through `env:`, never through `${{ }}`
#   interpolation inside `run:` — an input that lands in a shell as text is a
#   code-execution path;
# - `commit` must be a full SHA reachable from `origin/main`, so the bytes
#   the verify job proved are the bytes the publish job builds: a branch name
#   would let the two jobs resolve differently across the approval pause;
# - the irreversible step sits behind the protected `npm-publish`
#   environment, and the verify job *checks* that the environment exists with
#   required reviewers, because GitHub silently creates a missing environment
#   with no protection at run time — a gate that fails open otherwise;
# - no long-lived token exists anywhere: publishing uses npm OIDC trusted
#   publishing, and `id-token: write` is granted to that one job;
# - the npm dist-tag is an input checked against the version before the
#   approval pause: a prerelease can never become `latest`, and a stable
#   version moves `latest` unless `stable-off-latest` says otherwise.
#
# docs/releasing.md is the procedure of record, including the one-time
# prerequisites (npm org, trusted publishing, the protected environment).
name: npm release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character SHA to publish from, reachable from main
        required: true
      version:
        description: Must equal the version in ts/package.json at that commit
        required: true
      dist-tag:
        description: npm dist-tag to publish under. `latest` for a stable version; a prerelease needs another, e.g. beta
        required: true
      stable-off-latest:
        description: Publish a stable version under a non-latest dist-tag (a backport); otherwise a stable version must use latest
        type: boolean
        default: false

permissions: {}

concurrency:
  # A second dispatch for the same version must not race the first, and no
  # dispatch may be cancelled mid-publish.
  group: npm-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the artifact before anything irreversible
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate the input shapes
        env:
          COMMIT: ${{ inputs.commit }}
          VERSION: ${{ inputs.version }}
          DIST_TAG: ${{ inputs.dist-tag }}
          STABLE_OFF_LATEST: ${{ inputs.stable-off-latest }}
        run: |
          set -euo pipefail
          printf '%s' "${COMMIT}" | grep -qE '^[0-9a-f]{40}$' \
            || { echo "commit must be a full 40-character lowercase SHA" >&2; exit 1; }
          printf '%s' "${VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            || { echo "version must be semver, e.g. 0.1.0" >&2; exit 1; }
          printf '%s' "${DIST_TAG}" | grep -qE '^[a-z][a-z0-9-]*$' \
            || { echo "dist-tag must be lowercase letters, digits and dashes, e.g. latest or beta" >&2; exit 1; }
          # The dist-tag is checked against the version, never trusted on its
          # own: npm refuses a prerelease with no --tag, but takes one with an
          # explicit `--tag latest`, which would make a beta what a plain
          # `npm i` installs. The prerelease flag is derived exactly as
          # release.yml derives it: the version regex above admits a dash only
          # in a prerelease suffix.
          case "${VERSION}" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac
          case "${STABLE_OFF_LATEST}" in
            true|false) ;;
            *) echo "stable-off-latest must be true or false" >&2; exit 1 ;;
          esac
          if [ "${prerelease}" = true ]; then
            if [ "${DIST_TAG}" = latest ]; then
              echo "${VERSION} is a prerelease; it must not be published as latest (use e.g. dist-tag=beta)" >&2
              exit 1
            fi
            if [ "${STABLE_OFF_LATEST}" = true ]; then
              echo "stable-off-latest applies to a stable version only; ${VERSION} is a prerelease" >&2
              exit 1
            fi
          elif [ "${DIST_TAG}" = latest ]; then
            if [ "${STABLE_OFF_LATEST}" = true ]; then
              echo "stable-off-latest was set but dist-tag is latest; drop one of them" >&2
              exit 1
            fi
          elif [ "${STABLE_OFF_LATEST}" != true ]; then
            echo "${VERSION} is a stable version and must be published as latest; a stable version under ${DIST_TAG} needs stable-off-latest=true" >&2
            exit 1
          fi
          printf 'version %s -> prerelease=%s, dist-tag=%s\n' "${VERSION}" "${prerelease}" "${DIST_TAG}"

      # The protection this workflow claims must actually exist: GitHub
      # creates a referenced-but-missing environment on the fly with zero
      # rules, so an unchecked `environment:` is decoration, not a gate.
      - name: Confirm the publish environment is protected
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          reviewers="$(gh api "repos/${REPO}/environments/npm-publish" \
            --jq '[.protection_rules[]? | select(.type == "required_reviewers")] | length' \
            2>/dev/null || echo unreadable)"
          if [ "${reviewers}" = unreadable ]; then
            echo "cannot read the npm-publish environment; create it with required reviewers (docs/releasing.md)" >&2
            exit 1
          fi
          if [ "${reviewers}" -lt 1 ]; then
            echo "the npm-publish environment has no required reviewers; it is not a gate" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      # A commit not reachable from main was never reviewed; publishing it
      # would put unreviewed bytes under a permanent name.
      - name: Confirm the commit is an ancestor of main
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          git merge-base --is-ancestor "${COMMIT}" FETCH_HEAD \
            || { echo "${COMMIT} is not reachable from origin/main" >&2; exit 1; }

      - name: The requested version must match the manifest exactly
        working-directory: crates/candid-core-ts/ts
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          manifest="$(node -p 'require("./package.json").version')"
          if [ "${manifest}" != "${VERSION}" ]; then
            echo "manifest is ${manifest}, requested ${VERSION}" >&2
            exit 1
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          registry-url: https://registry.npmjs.org

      - name: Install the pinned toolchain
        working-directory: crates/candid-core-ts/ts
        run: npm ci

      - name: Type-check and test
        working-directory: crates/candid-core-ts/ts
        run: npx tsc --noEmit && npm test

      - name: Verify the packaged artifact
        run: python3 tests/fixtures/packaging/verify_npm_package.py

  publish:
    name: Publish to npm (protected)
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      # The same immutable SHA the verify job proved: `commit` is a validated
      # full SHA, so this checkout cannot resolve to different bytes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          registry-url: https://registry.npmjs.org

      - name: Install the pinned toolchain
        working-directory: crates/candid-core-ts/ts
        run: npm ci

      - name: Build
        working-directory: crates/candid-core-ts/ts
        run: npm run build

      # The dist-tag the verify job checked against the version. Always
      # explicit: npm would otherwise apply `latest` to a stable version and
      # refuse a prerelease only after this job's approval.
      - name: Publish with provenance
        working-directory: crates/candid-core-ts/ts
        env:
          DIST_TAG: ${{ inputs.dist-tag }}
        run: npm publish --provenance --access public --tag "${DIST_TAG}"
