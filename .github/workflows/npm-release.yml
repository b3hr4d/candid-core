# Publishing @candid-core/schema — dispatch-only, mirroring release.yml's
# discipline for crates.io: the irreversible step sits behind a protected
# environment the owner approves explicitly, and no long-lived token exists
# anywhere (OIDC trusted publishing; the id-token permission is granted only
# to the publish job). npm names and versions are permanent; docs/releasing.md
# records the procedure and the version-bump protocol.
name: npm release

on:
  workflow_dispatch:
    inputs:
      commit:
        description: The exact commit to publish from
        required: true
      version:
        description: Must equal the version in ts/package.json at that commit
        required: true

permissions: {}

jobs:
  verify:
    name: Verify the artifact before anything irreversible
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
      - name: The requested version must match the manifest exactly
        working-directory: crates/candid-core-ts/ts
        run: |
          manifest="$(node -p 'require("./package.json").version')"
          if [ "$manifest" != "${{ inputs.version }}" ]; then
            echo "manifest is $manifest, requested ${{ inputs.version }}" >&2
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          registry-url: https://registry.npmjs.org
      - name: Install the pinned toolchain
        working-directory: crates/candid-core-ts/ts
        run: npm ci
      - name: Type-check and test
        working-directory: crates/candid-core-ts/ts
        run: npx tsc --noEmit && npm test
      - name: Verify the packaged artifact
        run: python3 tests/fixtures/packaging/verify_npm_package.py

  publish:
    name: Publish to npm (protected)
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.18.0"
          registry-url: https://registry.npmjs.org
      - name: Install the pinned toolchain
        working-directory: crates/candid-core-ts/ts
        run: npm ci
      - name: Build
        working-directory: crates/candid-core-ts/ts
        run: npm run build
      - name: Publish with provenance
        working-directory: crates/candid-core-ts/ts
        run: npm publish --provenance --access public
