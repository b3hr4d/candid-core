[package]
# A working name, not a published one. Nothing may publish this crate until its
# registry name is decided deliberately — crate names are permanent on
# crates.io, exactly like versions — and `publish = false` is what enforces
# that until then.
name = "candid-core-ts"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.78"
description = "TypeScript code generation over the candid-core Contract graph"
license = "Apache-2.0"
repository = "https://github.com/b3hr4d/candid-core"

[dependencies]
# The base surface only, and that is a design statement rather than a default:
# the generator consumes a validated Contract graph, so it needs no Candid
# parser, no filesystem capability, and no host-value ABI. If a future change
# needs a feature here, that is a boundary being crossed and belongs in review.
#
# `version` and `path` together on purpose. The workspace builds against the
# sibling for development, and any *released* form of this crate must depend on
# the published `candid-core` — the two crates' release cycles are independent
# by decision (issue #38). Cargo drops `path` at publish time and keeps the
# version requirement, so this declaration is already the released shape.
candid-core = { version = "=0.1.0-beta.2", path = "../..", default-features = false }

# Opt-in bridge from a compilation provenance sidecar to a TsNames table.
# Mirrors the upstream feature name so `candid-core-ts/compiler` reads as what
# it is; the library without it stays a pure base-surface consumer.
[features]
compiler = ["candid-core/compiler"]

# Dev-only: the candid-start prototype's schema regeneration driver. Gated so
# the featureless build (`cargo check -p candid-core-ts`) never compiles it —
# `TsNames::from_source_info` is `compiler`-feature surface.
[[example]]
name = "generate"
required-features = ["compiler"]

[dev-dependencies]
# The golden tests compile .did fixtures into Contracts, which needs the
# compiler surface — as a dev-dependency, exactly the pattern candid-core
# itself uses for candid_parser. Dev-dependencies never reach a downstream
# consumer, so the library boundary claim above is untouched; the featureless
# build is separately enforced by `cargo check -p candid-core-ts` in CI.
candid-core = { path = "../..", default-features = false, features = ["compiler"] }
# The authoritative Candid name hash, used by tests to state expected `_id_`
# keys without hardcoding hash values — the same authority candid-core itself
# pins its internal hash against.
candid_parser = "=0.4.0"
# Exact-pinned to match the crate under test: the determinism test round-trips
# a Contract through its serialized form.
serde_json = "=1.0.150"
